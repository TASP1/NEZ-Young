name: Train NEZ Young from Scratch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'train_from_scratch.py'
      - 'data/**'
      - '.github/workflows/train.yml'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # generous for CPU training

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show environment
        run: |
          python -c "import torch; print('PyTorch', torch.__version__); print('CUDA available:', torch.cuda.is_available())"
          free -h
          nproc

      - name: Train model from scratch
        run: |
          python train_from_scratch.py

      - name: Upload checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: nez-young-checkpoints
          path: |
            checkpoints/
          retention-days: 30

      - name: Commit best checkpoint (if small enough)
        run: |
          ls -lh checkpoints/
          # Only commit if the checkpoint is reasonably sized (< 50 MB)
          SIZE=$(du -m checkpoints/nez_young_best.pt | cut -f1)
          if [ "$SIZE" -lt 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add checkpoints/nez_young_best.pt checkpoints/tokenizer.json
            git commit -m "Add trained NEZ Young checkpoint (from-scratch, random init)" || echo "No changes"
            git push || echo "Push skipped (permissions or no changes)"
          else
            echo "Checkpoint too large to commit ($SIZE MB); available as artifact only"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
